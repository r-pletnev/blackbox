[project]
name = "blackbox"
version = "0.1.0"
description = "Decorator-based function call capture for inputs, outputs, exceptions, and local variables."
readme = "README.md"
authors = [
    { name = "Roman Pletnev", email = "4804877+r-pletnev@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = ["dill"]
keywords = ["debugging", "observability", "decorator", "trace", "dill", "pickle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"
